<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniGeigerCounter</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/style.css"></head><body><header><div class="brand"><img src="/static/favicon.svg"><span>MiniGeigerCounter<small>FTLab SGP001 · Audio Monitor</small></span></div><span id="status">verbinde…</span></header><main><section class="hero"><div><p>AKTUELLE STRAHLUNG</p><strong id="dose">—</strong><b>µSv/h</b><span id="level">—</span></div><div class="gauge"><span id="cpm">—</span><small>CPM · letzte Minute</small></div></section><section class="cards"><article><label>Gleitender Mittelwert</label><b id="smooth">— CPM</b></article><article><label>Impulse gesamt</label><b id="total">—</b></article><article><label>Audiopegel</label><b id="peak">—</b></article></section><section class="panel"><h2>Audiopegel <small id="rate"></small></h2><div class="meter"><div id="meterfill"></div><i id="thresholdmark"></i></div><p class="hint">Grün: Spitzenpegel. Gelbe Linie: Auslöseschwelle. Stelle sie knapp über dem Grundrauschen ein.</p></section><section class="panel"><div class="panelhead"><h2>Verlauf</h2><select id="range"><option value="24">24 Stunden</option><option value="168">7 Tage</option><option value="720">30 Tage</option></select></div><canvas id="chart"></canvas></section><section class="panel settings"><h2>Einstellungen</h2><form id="config"><label>Audio-Eingang<select name="audio_device" id="devices"></select></label><label>Impulsschwelle <output id="thresholdvalue"></output><input name="threshold" type="range" step="0.005" min="0.005" max="1"></label><label>Holdoff (ms)<input name="holdoff_ms" type="number" min="10"></label><label>Counts pro µSv/h<input name="counts_per_usvh" type="number" step="0.01" min="0.01"></label><label class="toggle">MQTT aktiv<input name="mqtt_enabled" type="checkbox"></label><label>MQTT Host<input name="mqtt_host"></label><label>MQTT Port<input name="mqtt_port" type="number"></label><label>MQTT Topic<input name="mqtt_topic"></label><button>Speichern</button></form><p id="message"></p></section></main><script src="/static/app.js"></script></body></html>
